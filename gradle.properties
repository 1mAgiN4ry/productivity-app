# Project-wide Gradle settings.
android.useAndroidX=true

# Specifies the JVM arguments used for the Gradle Daemon.
# Increasing heap size to 4GB fixes OutOfMemoryError during dexing of large libraries like material-icons-extended.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Enable parallel execution and caching
org.gradle.parallel=true
org.gradle.caching=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
